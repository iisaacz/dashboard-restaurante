services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurante
    ports: ["3306:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/restaurante?serverTimezone=America/Sao_Paulo
      DB_USER: root
      DB_PASSWORD: root
      APP_SEED: "true"
      CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
volumes:
  dbdata:

server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurante?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
app.seed=${APP_SEED:false}
app.jwt.secret=${JWT_SECRET:}
app.token-horas=${TOKEN_HORAS:12}
app.admin.user=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.reset=${ADMIN_RESET:false}
